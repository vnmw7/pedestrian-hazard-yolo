[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.5", features = ["multipart"] }
tokio = { version = "1.37.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
image = "0.25.1"
ndarray = "0.17.2"
bytes = "1.6.0"
reqwest = { version = "0.12.4", features = ["rustls-tls", "stream"] }
futures-util = "0.3.30"
